{{ define "main" }}
<div class="container container--narrow">
  <header class="project-header">
    <h1 class="project-header__title">{{ .Title }}</h1>
    {{ with .Params.lede }}<p class="project-header__lede">{{ . }}</p>{{ end }}
  </header>

  <div class="prose" style="padding-block-end: var(--sp-8)">
    {{ .Content }}
  </div>
</div>
{{ end }}
