<div class="contact-card">
  <h2 class="section__title" style="justify-content:center">{{ i18n "section_contact" }}</h2>
  <p class="section__sub" style="text-align:center">{{ i18n "section_contact_sub" }}</p>

  <div class="hero__actions" style="justify-content:center">
    <a class="btn btn--primary" href="mailto:{{ site.Params.email }}">
      {{ partial "icon.html" "mail" }} {{ site.Params.email }}
    </a>
  </div>

  {{ partial "social.html" . }}
</div>
