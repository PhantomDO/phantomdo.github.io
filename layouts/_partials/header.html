<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      Donnovan Feuillastre<span class="brand__dot">.</span>
    </a>

    <button class="icon-btn nav-toggle" type="button"
            aria-expanded="false" aria-controls="site-nav" aria-label="{{ i18n "menu" }}">
      {{ partial "icon.html" "menu" }}
    </button>

    <nav class="site-nav" id="site-nav" aria-label="{{ i18n "menu" }}">
      {{ $currentPage := . }}
      {{ range site.Menus.main }}
        {{ $active := or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}
        <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="header-tools">
      {{ partial "lang-switcher.html" . }}
      <button class="icon-btn theme-toggle" type="button"
              aria-label="{{ i18n "toggle_theme" }}" title="{{ i18n "toggle_theme" }}">
        {{ partial "icon.html" "contrast" }}
      </button>
    </div>
  </div>
</header>
