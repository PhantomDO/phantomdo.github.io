baseURL = "https://phantomdo.github.io/"
title = "Donnovan Feuillastre"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# A portfolio of a handful of projects does not need faceted browsing.
disableKinds = ["taxonomy", "term"]

[params]
  author = "Donnovan Feuillastre"
  email = "dfeuillastre.pro@proton.me"
  location = "France"
  profileImage = "images/profile.jpg"

  [params.social]
    github = "PhantomDO"
    gitlab = "PhantomDO"
    itch = "phantomdo"

[languages]
  [languages.en]
    label = "EN"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Donnovan Feuillastre"
    [languages.en.params]
      tagline = "Software & Game Developer"
      description = "Software and game developer specialised in high-performance, modular systems. Unreal Engine 5, Unity, C++ and C#."
    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 10
    [[languages.en.menus.main]]
      name = "CV"
      pageRef = "/cv"
      weight = 20
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 30

  [languages.fr]
    label = "FR"
    locale = "fr-FR"
    contentDir = "content/fr"
    weight = 2
    title = "Donnovan Feuillastre"
    [languages.fr.params]
      tagline = "Développeur logiciel & jeux vidéo"
      description = "Développeur logiciel et jeux vidéo spécialisé dans les systèmes performants et modulaires. Unreal Engine 5, Unity, C++ et C#."
    [[languages.fr.menus.main]]
      name = "Projets"
      pageRef = "/projects"
      weight = 10
    [[languages.fr.menus.main]]
      name = "CV"
      pageRef = "/cv"
      weight = 20
    [[languages.fr.menus.main]]
      name = "À propos"
      pageRef = "/about"
      weight = 30

