experience:
  - company: SPINWARE
    url: https://spinwaregames.com
    role: Développeur jeux vidéo
    period: "Décembre 2025 - Aujourd'hui"
    location: Puteaux, France
    contract: CDI
    highlights:
      - "**Conçu à mon initiative un socle technique transverse** (modules runtime et éditeur) remplaçant les références dures d'assets par une résolution par GameplayTag et un chargement asynchrone à la demande, supprimant les dépendances en cascade qui alourdissaient les Blueprints et les temps de build."
      - "**Développé l'outil éditeur Slate générique associé**, piloté par réflexion sur `UScriptStruct` : chaque type d'asset géré (sons, effets, items, emotes, matériaux, niveaux, dialogues) se déclare en une ligne, sans écrire d'interface. Renommage sécurisé par Core Redirects, undo/redo, drag & drop, suivi des assets manquants."
      - "**Sorti l'intégration des assets de l'équipe technique** : un profil non-programmeur les saisit en autonomie, là où il fallait auparavant un développeur dans un Blueprint. Socle repris sur le projet suivant après la mise en pause du projet d'origine."
      - "**Intégré Redpoint EOS** et développé la couche UI et le relais jeu/plugin du système de party en ligne : invitations in-game, rejoindre et quitter une session."
      - "**Implémenté des interactions multijoueur via le Gameplay Ability System** (ragdoll répliqué sur explosion de proximité, chat vocal de proximité activable par objet) ainsi qu'un système d'inventaire, sur 3 projets."
    tech: [Unreal Engine 5, C++, Slate, Blueprint, GameplayTags, GAS, Redpoint EOS, Git]

  - company: FORMATION ET PROJET PERSONNEL
    role: Recherche active
    period: "Décembre 2024 - Novembre 2025"
    contract: ""
    highlights:
      - "**Formation intensive au Gameplay Ability System d'Unreal Engine 5** en C++ (cursus Ulibarri, 105 h) : 72 h suivies couvrant l'intégralité du socle systémique, des Attribute Sets et Gameplay Effects aux Gameplay Tags, Gameplay Abilities, Ability Tasks, coûts et cooldowns, progression et niveaux, IA par Behavior Trees et EQS, interfaces en MVVM et réplication multijoueur."
      - "***Souls Boss Arena***, prototype personnel sous Unreal Engine 5.6, C++/Blueprint, 254 commits, code source public : combat bâti sur GAS, ciblage lock-on et roulade, endurance et frames d'invincibilité, boss à deux phases piloté par behavior tree, outils de debug intégrés, support manette et clavier, VFX Niagara."
      - "**Compétences mises en production dès la prise de poste suivante** : socle d'assets indexé par GameplayTag et interactions multijoueur en GAS livrés chez Spinware dans les mois qui ont suivi."
    tech: [Unreal Engine 5, C++, Blueprint, GAS, Behavior Trees, Niagara]

  - company: WANADEV STUDIO
    url: https://www.wanadevstudio.com
    role: Développeur jeux vidéo
    period: "Septembre 2024 - Décembre 2024"
    location: Lyon, France
    contract: CDI
    reference:
      name: Benoit Djerigian
      role: Lead Developer
      url: https://linkedin.com/in/bdjerigian/
    highlights:
      - "**Porté le déplacement et une partie de l'UI de *Propagation: Paradise Hotel* sur le tapis de locomotion Virtuix Omni One**, jusqu'à publication sur le store de la plateforme. Développement mené sans accès au matériel, resté aux États-Unis, ni à l'OS cible, avec une boucle de test de 24 heures."
      - "**Levé cette contrainte** en simulant les entrées du tapis au joystick (jeu terminé intégralement en simulation) et en livrant aux testeurs distants des commandes de debug leur permettant de calibrer eux-mêmes les paramètres de vitesse."
      - "**Optimisé *Vestiges: Fallen Tribes* sur Pico** : pooling des unités et de leurs Behavior Trees pour supprimer le pic de respawn au changement de phase, passage des textures d'unités en texture arrays avec un artiste. **Framerate porté de 15 à 30 fps et suppression des crashs** ; optimisation poursuivie par l'équipe après mon départ."
      - "Soutien QA et playtests internes sur un troisième projet, *Species: Unknown*."
    tech: [Unreal Engine 4, Unreal Engine 5, C++, Blueprint, "VR standalone (Pico, Omni One)", SDK matériel, Pooling, Profilage]

  - company: PIECE OF CAKE STUDIOS
    url: https://www.pieceofcake-studios.com
    role: Développeur moteur & outils
    period: "Mai 2022 - Mars 2024"
    location: Paris, France
    contract: Stage puis CDD
    reference:
      name: Xavier Lemaitre
      role: CTO
      url: https://linkedin.com/in/xlemaitre
    highlights:
      - "**Porté *My Fantastic Ranch: Unicorns & Dragons* (éd. Nacon) sur consoles 8ᵉ et 9ᵉ génération** (Switch, PS4, PS5, Xbox) jusqu'à la validation constructeur : conformité plateforme complète, mise en veille et reprise, gestion des manettes, intégrité des sauvegardes, changement de compte. Seul sur le portage après le départ du second développeur."
      - "**Développé un gestionnaire de succès multiplateforme** unifiant les SDK des plateformes de sortie derrière une interface unique, hors définition des trophées PS4 qui passe par l'outillage Sony dédié."
      - "**Mené la migration d'un projet Unity de la version 2018 à la version 2022** sur un second titre : passage en Asset Bundles, bascule du rendu deferred vers forward sur une scène à forte densité de lumières, split screen console."
      - "**Optimisé le rendu sous contrainte Nintendo Switch**, split screen compris, charge de rendu doublée : réduction du budget d'éclairage à rendu équivalent, résolution dynamique."
      - "**Étendu la chaîne d'intégration continue GitLab aux builds console**, avec configurations et variantes de build par plateforme. Intégration des Epic Online Services dans Unity."
    tech: [Unity, C#, C++, Shaders, "SDK consoles (Nintendo, Sony, Microsoft)", GitLab CI, Perforce]

  - company: ICONIK STUDIO
    role: Développeur jeux vidéo
    period: "Avril 2020 - Août 2021"
    location: La Ciotat, France
    contract: Alternance (12 mois) puis CDD
    reference:
      name: Curtis Pelissier
      role: Lead Developer
      url: https://linkedin.com/in/curtis-pelissier
    highlights:
      - "**Développé un éditeur nodal de behavior trees en interne** sous Unity, pour éviter l'achat d'un plugin tiers : fenêtres d'éditeur custom, sérialisation du graphe, exécution des arbres. Utilisé sur **KING PONG** (VR)."
      - "**Corrigé la désynchronisation de la physique de la balle en multijoueur** : réduction du nombre de RPC et passage du transport TCP à KCP (UDP fiable), supprimant les à-coups liés au head-of-line blocking. Désynchronisation ramenée à un niveau acceptable en VR."
      - "Développé les systèmes de combat « Ultimate Attack » : machines à états, configuration data-driven."
    tech: [Unity, C#, Éditeur custom, Mirror, PlayFab, VR]

