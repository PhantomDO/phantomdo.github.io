summary: >-
  Développeur jeu vidéo, 5 ans d'expérience en C++/Unreal Engine et C#/Unity. 5 jeux shippés, dont
  un portage console multiplateforme (Switch, PS4, PS5, Xbox) mené jusqu'à la validation
  constructeur et un portage sur tapis de locomotion VR. Spécialisé dans les systèmes gameplay
  modulaires, l'outillage interne et l'optimisation temps réel.

